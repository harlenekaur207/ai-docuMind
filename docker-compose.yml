services:
  api:
    build: .
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - documind-data:/app/data
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  documind-data:
